<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Second Listen twelve-month roadmap</title>
  <desc id="d">Four quarters. Q1: one-tap library move beta and the Super Bowl Halftime free month. Q2: graduate offer and the Spatial Audio first listen. Q3: monthly Replay stories and cross-service shared playlists. Q4: Apple One household push, year-end Replay and Android improvements.</desc>
  <rect width="1200" height="560" fill="#16070F"/>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="64" font-size="15" font-weight="700" letter-spacing="3" fill="#FF4D7A">ROADMAP</text>
    <text x="60" y="112" font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFF1F5">Twelve months, four moments</text>
    <line x1="60" y1="190" x2="1140" y2="190" stroke="#3A2130" stroke-width="4"/>
    <g transform="translate(60 0)">
      <circle cx="30" cy="190" r="28" fill="#FF4D7A"/>
      <text x="30" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#16070F">Q1</text>
      <text x="72" y="184" font-size="14" font-weight="700" letter-spacing="2" fill="#D9B8C6">JAN–MAR</text>
      <rect x="0" y="250" width="250" height="250" rx="18" fill="#24101B" stroke="#3A2130" stroke-width="2"/>
      <text x="24" y="300" font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="italic" fill="#FFA06B">Super Bowl</text>
      <text x="24" y="350" font-size="18" fill="#FFF1F5">Library move (beta)</text>
      <text x="24" y="384" font-size="18" fill="#FFF1F5">Halftime free month</text>
      <text x="24" y="418" font-size="18" fill="#FFF1F5"></text>
    </g>
    <g transform="translate(335 0)">
      <circle cx="30" cy="190" r="28" fill="#FFA06B"/>
      <text x="30" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#16070F">Q2</text>
      <text x="72" y="184" font-size="14" font-weight="700" letter-spacing="2" fill="#D9B8C6">APR–JUN</text>
      <rect x="0" y="250" width="250" height="250" rx="18" fill="#24101B" stroke="#3A2130" stroke-width="2"/>
      <text x="24" y="300" font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="italic" fill="#FFA06B">Graduation</text>
      <text x="24" y="350" font-size="18" fill="#FFF1F5">Graduate offer</text>
      <text x="24" y="384" font-size="18" fill="#FFF1F5">Spatial first listen</text>
      <text x="24" y="418" font-size="18" fill="#FFF1F5">CarPlay and Watch</text>
    </g>
    <g transform="translate(610 0)">
      <circle cx="30" cy="190" r="28" fill="#FF4D7A"/>
      <text x="30" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#16070F">Q3</text>
      <text x="72" y="184" font-size="14" font-weight="700" letter-spacing="2" fill="#D9B8C6">JUL–SEP</text>
      <rect x="0" y="250" width="250" height="250" rx="18" fill="#24101B" stroke="#3A2130" stroke-width="2"/>
      <text x="24" y="300" font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="italic" fill="#FFA06B">Summer</text>
      <text x="24" y="350" font-size="18" fill="#FFF1F5">Monthly Replay</text>
      <text x="24" y="384" font-size="18" fill="#FFF1F5">Cross-service playlists</text>
      <text x="24" y="418" font-size="18" fill="#FFF1F5">SharePlay anywhere</text>
    </g>
    <g transform="translate(885 0)">
      <circle cx="30" cy="190" r="28" fill="#FFA06B"/>
      <text x="30" y="198" text-anchor="middle" font-size="20" font-weight="800" fill="#16070F">Q4</text>
      <text x="72" y="184" font-size="14" font-weight="700" letter-spacing="2" fill="#D9B8C6">OCT–DEC</text>
      <rect x="0" y="250" width="250" height="250" rx="18" fill="#24101B" stroke="#3A2130" stroke-width="2"/>
      <text x="24" y="300" font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" font-style="italic" fill="#FFA06B">Holidays</text>
      <text x="24" y="350" font-size="18" fill="#FFF1F5">Apple One households</text>
      <text x="24" y="384" font-size="18" fill="#FFF1F5">Year-end Replay</text>
      <text x="24" y="418" font-size="18" fill="#FFF1F5">Android upgrades</text>
    </g>
  </g>
</svg>
